<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-sidecar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13' fill='%23ff9e64'%3E✳%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --ink-0: oklch(15.5% 0.012 55);
    --ink-1: oklch(19% 0.014 55);
    --ink-2: oklch(24% 0.018 55);
    --line: oklch(31% 0.02 55);
    --line-soft: oklch(26% 0.018 55);
    --text: oklch(93% 0.012 65);
    --text-dim: oklch(76% 0.022 60);
    --ember: oklch(74% 0.155 45);
    --ember-hot: oklch(81% 0.16 55);
    --ember-ink: oklch(22% 0.05 45);
    --ok: oklch(78% 0.14 155);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --statusbar-h: 27px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 282px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) var(--statusbar-h);
    background: var(--ink-0);
    color: var(--text);
    font: 14px/1.5 var(--font-sans);
  }
  ::selection { background: var(--ember); color: var(--ember-ink); }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

  /* ---------------------------------------------------------------- sidebar */

  #sidebar {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line);
    background: var(--ink-1);
  }
  #sidebar header {
    display: flex; align-items: center; gap: 9px;
    padding: 15px 16px 14px;
    border-bottom: 1px solid var(--line);
    font-weight: 600; letter-spacing: -0.01em;
  }
  #sidebar header .mark { color: var(--ember); font-size: 16px; line-height: 1; }

  .pane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .pane-label {
    display: flex; align-items: baseline; gap: 8px;
    padding: 14px 16px 8px;
    font: 600 10.5px/1 var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--text-dim);
  }
  .pane-label .hint {
    margin-left: auto;
    text-transform: none; letter-spacing: 0;
    font-weight: 400; color: var(--text-dim); opacity: .7;
  }
  .pane-body { flex: 1; overflow-y: auto; padding: 0 8px 12px; }

  /* one group per project: the outermost level of the artifact tree */
  .project + .project {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line-soft);
  }
  .project-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 3px 8px 5px;
  }
  .project-name {
    font: 600 11px/1.3 var(--font-mono);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .project-count {
    margin-left: auto; flex: none;
    font: 400 10px/1 var(--font-mono); color: var(--text-dim);
  }

  /* a session inside a project, with its artifacts nested beneath it */
  .session { border-radius: 9px; }
  .session.selected { background: oklch(24% 0.018 55 / 0.55); }
  .session-row {
    display: flex; align-items: center; gap: 2px;
    border-radius: 9px; border: 1px solid transparent;
    padding-right: 6px;
  }
  .session-row:hover { background: var(--ink-2); }
  .session.selected > .session-row {
    background: oklch(74% 0.155 45 / 0.11);
    border-color: oklch(74% 0.155 45 / 0.38);
  }

  .twist {
    flex: none; width: 20px; height: 28px;
    background: none; border: 0; cursor: pointer;
    color: var(--text-dim); font: 400 13px/1 var(--font-sans);
    display: grid; place-items: center;
    border-radius: 5px;
  }
  .twist span { display: block; transition: transform .15s ease; }
  .twist[aria-expanded="false"] span { transform: rotate(-90deg); }
  .twist:hover { color: var(--text); }
  /* a session with nothing in it keeps the same label indent, minus the control */
  .twist-spacer { flex: none; width: 20px; }

  .session-main {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 9px;
    background: none; border: 0; cursor: pointer;
    color: inherit; font: inherit; text-align: left;
    padding: 8px 4px 8px 0;
  }
  .session-main .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--ok); box-shadow: 0 0 7px oklch(78% 0.14 155 / 0.45);
  }
  .session.ended .dot { background: var(--line); box-shadow: none; }
  .session.ended .label { color: var(--text-dim); }
  .session-main .label {
    font: 500 12.5px var(--font-mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .session.selected .label { color: var(--ember-hot); }
  .session-main .count {
    font: 400 10.5px var(--font-mono); color: var(--text-dim); flex: none;
  }
  .session-row .badge {
    flex: none;
    background: var(--ember); color: var(--ember-ink);
    font: 600 10px/1 var(--font-mono);
    padding: 3px 6px; border-radius: 999px;
  }
  .session-row .dismiss {
    flex: none; background: none; border: 0; cursor: pointer;
    color: var(--text-dim); font: 400 14px/1 var(--font-sans);
    padding: 2px 3px; border-radius: 4px;
    opacity: 0; transition: opacity .15s;
  }
  .session-row:hover .dismiss, .session-row .dismiss:focus-visible { opacity: 1; }
  .session-row .dismiss:hover { color: var(--ember-hot); }

  /* the nested artifact list — a guide line ties each artifact to its session */
  .artifacts {
    margin: 1px 0 6px 21px;
    padding-left: 9px;
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 1px;
  }
  .artifact-item {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 7px;
    color: inherit; font: inherit; cursor: pointer;
    padding: 6px 9px;
    position: relative;
  }
  .artifact-item:hover { background: var(--ink-2); }
  .artifact-item.active { background: oklch(74% 0.155 45 / 0.09); }
  .artifact-item.active::before {
    content: ""; position: absolute;
    left: -10px; top: 8px; bottom: 8px; width: 2px;
    background: var(--ember); border-radius: 2px;
  }
  .artifact-item .title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 13px;
  }
  .artifact-item.active .title { color: var(--ember-hot); font-weight: 500; }
  .artifact-item .time {
    color: var(--text-dim); font: 400 10.5px var(--font-mono); margin-top: 2px;
  }

  .empty-note { color: var(--text-dim); padding: 26px 14px; text-align: center; font-size: 12.5px; }

  /* ------------------------------------------------------------------- main */

  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  #topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 16px 11px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--ink-1);
  }
  #topbar .headings { min-width: 0; flex: 1; }
  #topbar-title {
    font: 600 14.5px/1.3 var(--font-sans); letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #topbar-crumbs {
    margin-top: 3px;
    font: 400 10.5px/1.3 var(--font-mono); color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #topbar-crumbs .sep { opacity: .45; padding: 0 5px; }
  #topbar-crumbs .ember { color: var(--ember); opacity: .9; }
  .tool-btn {
    flex: none; display: grid; place-items: center;
    width: 30px; height: 30px;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-dim); font: 400 13px/1 var(--font-sans);
    cursor: pointer; text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  .tool-btn:hover { color: var(--ember-hot); border-color: var(--ember); }
  .tool-btn[aria-disabled="true"] { opacity: .35; pointer-events: none; }

  /* the stage frames the artifact: the one light surface in a dark shell */
  #stage { flex: 1; display: flex; position: relative; min-height: 0; padding: 14px; }
  #frame {
    flex: 1; display: flex; min-width: 0;
    border-radius: 12px; overflow: hidden;
    /* the documented "--glow" signature: a lit artifact panel in a dark shell */
    box-shadow: 0 0 0 1px var(--line), 0 20px 46px -32px oklch(74% 0.155 45 / 0.3);
  }
  #viewer { flex: 1; border: 0; width: 100%; background: #fff; }
  #placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-dim); gap: 12px; padding: 24px; text-align: center;
  }
  #placeholder .logo { font-size: 38px; color: var(--ember); opacity: .8; }
  #placeholder-text { max-width: 34ch; }

  /* composer: talk to the selected session from the browser, no artifact required */
  #composer {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--ink-1);
  }
  #composer input {
    flex: 1; min-width: 0;
    background: var(--ink-0); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 14px; font: 13.5px var(--font-sans);
    outline: none;
    transition: border-color .15s;
  }
  #composer input:focus { border-color: var(--ember); }
  #composer input::placeholder { color: var(--text-dim); }
  #composer input:disabled { opacity: .55; cursor: not-allowed; }
  #composer button {
    background: var(--ember); color: var(--ember-ink);
    border: 0; border-radius: 8px;
    padding: 10px 18px; font: 600 12px var(--font-mono);
    cursor: pointer;
  }
  #composer button:hover { background: var(--ember-hot); }
  #composer button:disabled { opacity: .5; cursor: default; }

  /* -------------------------------------------------------------- statusbar */

  #statusbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 0;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--ink-1);
    font: 400 10.5px/1 var(--font-mono);
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden;
  }
  #statusbar .item {
    padding: 0 10px;
    overflow: hidden; text-overflow: ellipsis;
  }
  #statusbar .item + .item { border-left: 1px solid var(--line); }
  #statusbar .spacer { flex: 1; min-width: 8px; }
  #statusbar #sb-conn { display: flex; align-items: center; gap: 6px; }
  #statusbar #sb-queued { color: var(--ember); }
  #statusbar #sb-version { color: var(--text); opacity: .8; }
  #status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: oklch(58% 0.18 25);
    transition: background .3s, box-shadow .3s;
  }
  #status-dot.connected { background: var(--ok); box-shadow: 0 0 7px oklch(78% 0.14 155 / 0.5); }

  #toast {
    position: fixed;
    bottom: calc(var(--statusbar-h) + 72px); left: 50%;
    transform: translateX(-50%) translateY(160px);
    background: var(--ember); color: var(--ember-ink);
    border: 0;
    padding: 9px 18px;
    border-radius: 999px;
    font: 600 12.5px var(--font-mono);
    transition: transform .25s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    box-shadow: 0 0 24px oklch(74% 0.155 45 / 0.4);
    z-index: 10;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.actionable { pointer-events: auto; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    #toast, #status-dot, .twist span, .tool-btn,
    #composer input, .session-row .dismiss { transition: none; }
  }
  @media (max-width: 760px) {
    body { grid-template-columns: 218px minmax(0, 1fr); }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <header>
      <span class="mark">✳</span>
      <span>agent-sidecar</span>
    </header>

    <div class="pane" id="nav-pane">
      <div class="pane-label">artifacts <span class="hint">by project · session</span></div>
      <div class="pane-body" id="session-list">
        <div class="empty-note" id="sessions-empty">No agent sessions yet.</div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="headings">
        <div id="topbar-title">agent-sidecar canvas</div>
        <div id="topbar-crumbs">waiting for a session</div>
      </div>
      <button class="tool-btn" id="btn-reload" type="button" title="Reload this artifact" aria-label="Reload this artifact" aria-disabled="true">↻</button>
      <a class="tool-btn" id="btn-open" href="#" target="_blank" rel="noopener" title="Open this artifact in a new tab" aria-label="Open this artifact in a new tab" aria-disabled="true">↗</a>
    </div>

    <div id="stage">
      <div id="placeholder">
        <div class="logo">✳</div>
        <div id="placeholder-text">Artifacts your agent creates will appear here.</div>
      </div>
      <!-- sandboxed: artifact JS runs in an opaque origin and talks back only via postMessage -->
      <div id="frame" style="display:none">
        <iframe id="viewer" title="artifact" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </div>
    </div>

    <div id="composer">
      <input id="note-input" placeholder="Tell your agent something…" aria-label="Send a note to your agent" />
      <button id="note-send">send</button>
    </div>
  </div>

  <footer id="statusbar" aria-label="server status">
    <span class="item" id="sb-conn"><span id="status-dot" title="connection to the sidecar server"></span><span id="sb-conn-text">connecting…</span></span>
    <span class="item" id="sb-host">—</span>
    <span class="item" id="sb-sessions">no sessions</span>
    <span class="item" id="sb-artifacts">0 artifacts</span>
    <span class="item" id="sb-queued" hidden></span>
    <span class="spacer"></span>
    <span class="item" id="sb-version">v__SIDECAR_VERSION__</span>
  </footer>

  <button id="toast" type="button" aria-live="polite">✓ Sent</button>

<script>
  const TOKEN = '__SIDECAR_TOKEN__' // injected by the server when this page is served
  const BUILD_VERSION = '__SIDECAR_VERSION__'

  const el = id => document.getElementById(id)
  const sessionList = el('session-list')
  const sessionsEmpty = el('sessions-empty')
  const viewer = el('viewer')
  const frame = el('frame')
  const placeholder = el('placeholder')
  const placeholderText = el('placeholder-text')
  const topbarTitle = el('topbar-title')
  const topbarCrumbs = el('topbar-crumbs')
  const btnReload = el('btn-reload')
  const btnOpen = el('btn-open')
  const statusDot = el('status-dot')
  const sbConnText = el('sb-conn-text')
  const sbHost = el('sb-host')
  const sbSessions = el('sb-sessions')
  const sbArtifacts = el('sb-artifacts')
  const sbQueued = el('sb-queued')
  const sbVersion = el('sb-version')
  const toast = el('toast')
  const noteInput = el('note-input')
  const noteSend = el('note-send')

  /** id -> session summary ({ id, project, label, live, artifacts: [...] }) */
  let sessions = new Map()
  /** session id -> count of artifact events you haven't looked at */
  const unseen = new Map()
  /** sessions whose artifact list is expanded in the tree */
  const expanded = new Set()
  let selectedSessionId = null
  let activeArtifactId = null
  let serverInfo = null
  let toastAction = null

  const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  const session = id => sessions.get(id) || null
  const sessionOfArtifact = artifactId => {
    for (const s of sessions.values()) if (s.artifacts.some(a => a.id === artifactId)) return s
    return null
  }
  const artifactsOf = id => (session(id)?.artifacts ?? []).slice().sort((a, b) => a.createdAt - b.createdAt)
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`

  function post(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Sidecar-Token': TOKEN },
      body: JSON.stringify(body),
    })
  }

  function showToast(text, action) {
    toast.textContent = text
    toastAction = action || null
    toast.classList.toggle('actionable', !!toastAction)
    toast.classList.add('show')
    clearTimeout(showToast.timer)
    showToast.timer = setTimeout(() => toast.classList.remove('show'), toastAction ? 5000 : 1800)
  }
  toast.addEventListener('click', () => {
    if (!toastAction) return
    const run = toastAction
    toastAction = null
    toast.classList.remove('show', 'actionable')
    run()
  })

  // --- rendering ------------------------------------------------------------

  /** project -> its sessions, oldest first. The shape the sidebar tree renders. */
  function groupByProject() {
    const byProject = new Map()
    for (const s of [...sessions.values()].sort((a, b) => a.startedAt - b.startedAt)) {
      if (!byProject.has(s.project)) byProject.set(s.project, [])
      byProject.get(s.project).push(s)
    }
    return [...byProject].sort((a, b) => a[0].localeCompare(b[0]))
  }

  function renderTree() {
    sessionList.querySelectorAll('.project').forEach(n => n.remove())
    sessionsEmpty.style.display = sessions.size ? 'none' : 'block'

    for (const [project, rows] of groupByProject()) {
      const group = document.createElement('div')
      group.className = 'project'

      const head = document.createElement('div')
      head.className = 'project-head'
      const name = document.createElement('div')
      name.className = 'project-name'
      name.textContent = project
      name.title = rows[0].cwd
      const count = document.createElement('div')
      count.className = 'project-count'
      const liveHere = rows.filter(s => s.live).length
      count.textContent = liveHere ? `${liveHere} live` : plural(rows.length, 'session')
      head.append(name, count)
      group.appendChild(head)

      for (const s of rows) group.appendChild(renderSession(s))
      sessionList.appendChild(group)
    }
  }

  function renderSession(s) {
    const isSelected = s.id === selectedSessionId
    const items = artifactsOf(s.id).reverse() // newest first
    const isOpen = expanded.has(s.id)

    const wrap = document.createElement('div')
    wrap.className = 'session' + (s.live ? '' : ' ended') + (isSelected ? ' selected' : '')

    const row = document.createElement('div')
    row.className = 'session-row'

    let twist
    if (items.length) {
      twist = document.createElement('button')
      twist.type = 'button'
      twist.className = 'twist'
      twist.setAttribute('aria-expanded', String(isOpen))
      twist.setAttribute('aria-label', `${isOpen ? 'Collapse' : 'Expand'} artifacts of ${s.label}`)
      twist.innerHTML = '<span>▾</span>'
      twist.addEventListener('click', () => {
        if (expanded.has(s.id)) expanded.delete(s.id)
        else expanded.add(s.id)
        renderTree()
      })
    } else {
      twist = document.createElement('span')
      twist.className = 'twist-spacer'
    }

    const main = document.createElement('button')
    main.type = 'button'
    main.className = 'session-main'
    main.setAttribute('aria-pressed', String(isSelected))
    main.title = s.live ? `${s.id} · live` : `${s.id} · ended ${fmtTime(s.endedAt)}`
    const dot = document.createElement('span')
    dot.className = 'dot'
    const label = document.createElement('span')
    label.className = 'label'
    label.textContent = s.label
    main.append(dot, label)
    main.addEventListener('click', () => {
      expanded.add(s.id)
      selectSession(s.id)
    })

    row.append(twist, main)

    const pendingCount = unseen.get(s.id) || 0
    if (pendingCount && !isSelected) {
      const badge = document.createElement('span')
      badge.className = 'badge'
      badge.textContent = String(pendingCount)
      badge.title = `${plural(pendingCount, 'new artifact')} since you last looked here`
      row.appendChild(badge)
    } else {
      const n = document.createElement('span')
      n.className = 'count'
      n.textContent = items.length || ''
      row.appendChild(n)
    }

    if (!s.live) {
      const dismiss = document.createElement('button')
      dismiss.type = 'button'
      dismiss.className = 'dismiss'
      dismiss.textContent = '×'
      dismiss.title = 'Remove this ended session from the canvas'
      dismiss.setAttribute('aria-label', `Remove ended session ${s.label}`)
      dismiss.addEventListener('click', () => {
        fetch('/api/sessions/' + encodeURIComponent(s.id), {
          method: 'DELETE',
          headers: { 'X-Sidecar-Token': TOKEN },
        })
      })
      row.appendChild(dismiss)
    }

    wrap.appendChild(row)
    if (isOpen && items.length) wrap.appendChild(renderArtifacts(items))
    return wrap
  }

  function renderArtifacts(items) {
    const list = document.createElement('div')
    list.className = 'artifacts'
    for (const a of items) {
      const row = document.createElement('button')
      row.type = 'button'
      row.className = 'artifact-item' + (a.id === activeArtifactId ? ' active' : '')
      row.setAttribute('aria-pressed', String(a.id === activeArtifactId))
      const title = document.createElement('div')
      title.className = 'title'
      title.textContent = a.title
      const time = document.createElement('div')
      time.className = 'time'
      time.textContent = fmtTime(a.createdAt)
      row.append(title, time)
      row.addEventListener('click', () => selectArtifact(a.id))
      list.appendChild(row)
    }
    return list
  }

  function renderTopbar() {
    const s = session(selectedSessionId)
    const a = s && activeArtifactId ? s.artifacts.find(x => x.id === activeArtifactId) : null

    topbarTitle.textContent = a ? a.title : s ? 'No artifact selected' : 'agent-sidecar canvas'
    topbarCrumbs.textContent = ''
    if (s) {
      const bits = [s.project, s.label]
      bits.forEach((bit, i) => {
        if (i) topbarCrumbs.append(sep('/'))
        const span = document.createElement('span')
        if (i === 1) span.className = 'ember'
        span.textContent = bit
        topbarCrumbs.appendChild(span)
      })
      if (!s.live) {
        topbarCrumbs.append(sep('·'))
        topbarCrumbs.append(document.createTextNode('ended'))
      }
      if (a) {
        topbarCrumbs.append(sep('·'))
        topbarCrumbs.append(document.createTextNode(`updated ${fmtTime(a.updatedAt)}`))
      }
    } else {
      topbarCrumbs.textContent = 'waiting for a session'
    }

    const url = a ? '/artifact/' + encodeURIComponent(a.id) : '#'
    btnOpen.href = url
    btnOpen.setAttribute('aria-disabled', String(!a))
    btnReload.setAttribute('aria-disabled', String(!a))
  }

  function sep(char) {
    const s = document.createElement('span')
    s.className = 'sep'
    s.textContent = char
    return s
  }

  function renderComposer() {
    const s = session(selectedSessionId)
    const canSend = !!s && s.live
    noteInput.disabled = !canSend
    noteSend.disabled = !canSend
    noteInput.placeholder = !s
      ? 'No session to talk to yet…'
      : s.live
        ? `Tell ${s.project} / ${s.label} something…`
        : 'This session has ended'
  }

  function renderStatus() {
    const all = [...sessions.values()]
    const live = all.filter(s => s.live).length
    const artifacts = all.reduce((n, s) => n + s.artifacts.length, 0)
    const queued = all.reduce((n, s) => n + (s.queued || 0), 0)

    sbHost.textContent = serverInfo ? `127.0.0.1:${serverInfo.port}` : '—'
    sbHost.title = serverInfo ? `sidecar server pid ${serverInfo.pid}, started ${serverInfo.startedAt}` : ''
    sbSessions.textContent = all.length ? `${live} live / ${plural(all.length, 'session')}` : 'no sessions'
    sbArtifacts.textContent = plural(artifacts, 'artifact')
    sbQueued.hidden = queued === 0
    sbQueued.textContent = `${plural(queued, 'reply')} queued`
    sbQueued.title = 'sent, waiting for your agent to read it'
    sbVersion.textContent = 'v' + ((serverInfo && serverInfo.version) || BUILD_VERSION)
  }

  function render() {
    renderTree()
    renderTopbar()
    renderComposer()
    renderStatus()
  }

  function setConnected(ok) {
    statusDot.classList.toggle('connected', ok)
    sbConnText.textContent = ok ? 'connected' : 'offline'
  }

  // --- selection ------------------------------------------------------------

  function showPlaceholder(text) {
    activeArtifactId = null
    frame.style.display = 'none'
    viewer.src = 'about:blank'
    placeholderText.textContent = text
    placeholder.style.display = 'flex'
  }

  function selectSession(id, opts = {}) {
    if (!session(id)) return
    const changed = selectedSessionId !== id
    selectedSessionId = id
    unseen.delete(id)
    expanded.add(id)
    if (changed || opts.force) {
      // tell the server where notes and unaddressed webhooks should land
      post('/api/canvas/active', { sessionId: id }).catch(() => {})
    }
    const items = artifactsOf(id)
    const wanted = opts.artifactId && items.some(a => a.id === opts.artifactId) ? opts.artifactId : null
    if (wanted) selectArtifact(wanted)
    else if (items.length) selectArtifact(items[items.length - 1].id)
    else {
      showPlaceholder('Artifacts your agent creates will appear here.')
      render()
    }
  }

  function selectArtifact(id) {
    const owner = sessionOfArtifact(id)
    if (!owner) return
    if (owner.id !== selectedSessionId) return selectSession(owner.id, { artifactId: id })
    const a = owner.artifacts.find(x => x.id === id)
    activeArtifactId = id
    location.hash = id
    placeholder.style.display = 'none'
    frame.style.display = 'flex'
    viewer.src = '/artifact/' + encodeURIComponent(id) + '?v=' + a.updatedAt
    render()
  }

  btnReload.addEventListener('click', () => {
    if (activeArtifactId) selectArtifact(activeArtifactId)
  })

  /** Newest live session, else newest session overall. */
  function bestSession() {
    const all = [...sessions.values()].sort((a, b) => b.startedAt - a.startedAt)
    return all.find(s => s.live) || all[0] || null
  }

  // --- server stream --------------------------------------------------------

  let firstSnapshot = true

  function applySnapshot(msg) {
    sessions = new Map(msg.sessions.map(s => [s.id, s]))
    serverInfo = msg.server
    for (const id of [...unseen.keys()]) if (!sessions.has(id)) unseen.delete(id)
    for (const id of [...expanded]) if (!sessions.has(id)) expanded.delete(id)
    // live sessions come expanded: that's where new artifacts will show up
    for (const s of sessions.values()) if (s.live) expanded.add(s.id)

    // honor a deep-link hash on first load only
    const wantedArtifact = firstSnapshot ? location.hash.slice(1) : ''
    firstSnapshot = false
    const deepLinked = wantedArtifact ? sessionOfArtifact(wantedArtifact) : null

    if (deepLinked) selectSession(deepLinked.id, { artifactId: wantedArtifact, force: true })
    else if (session(selectedSessionId)) selectSession(selectedSessionId, { artifactId: activeArtifactId, force: true })
    else {
      const best = bestSession()
      if (best) selectSession(best.id, { force: true })
      else {
        showPlaceholder('Artifacts your agent creates will appear here.')
        render()
      }
    }
  }

  function onArtifactCreated(msg) {
    const s = session(msg.sessionId)
    if (!s) return
    s.artifacts = s.artifacts.filter(a => a.id !== msg.artifact.id).concat(msg.artifact)
    expanded.add(msg.sessionId) // never hide an artifact that just arrived

    const showing = session(selectedSessionId)
    if (msg.sessionId === selectedSessionId) {
      selectArtifact(msg.artifact.id) // within the session you're watching, newest wins
      return
    }
    if (!showing || !showing.live) {
      // you're not mid-anything: follow the agent that's actually working
      selectSession(msg.sessionId, { artifactId: msg.artifact.id })
      return
    }
    // badge instead of yanking the view out from under an interaction elsewhere
    unseen.set(msg.sessionId, (unseen.get(msg.sessionId) || 0) + 1)
    render()
    showToast(`✳ ${s.project} · ${s.label}`, () => selectSession(s.id, { artifactId: msg.artifact.id }))
  }

  function connect() {
    const es = new EventSource('/events')
    es.onopen = () => setConnected(true)
    es.onerror = () => setConnected(false)
    es.onmessage = ev => {
      const msg = JSON.parse(ev.data)

      if (msg.type === 'snapshot') {
        applySnapshot(msg)
      } else if (msg.type === 'session') {
        const known = session(msg.session.id)
        sessions.set(msg.session.id, msg.session)
        // only a session we haven't seen expands itself — later events must not
        // reopen a tree the user deliberately collapsed
        if (!known && msg.session.live) expanded.add(msg.session.id)
        if (!session(selectedSessionId)) selectSession(msg.session.id, { force: true })
        else render()
        if (!known && msg.session.live) unseen.delete(msg.session.id)
      } else if (msg.type === 'session_removed') {
        sessions.delete(msg.id)
        unseen.delete(msg.id)
        expanded.delete(msg.id)
        if (selectedSessionId === msg.id) {
          selectedSessionId = null
          const best = bestSession()
          if (best) selectSession(best.id, { force: true })
          else { showPlaceholder('Artifacts your agent creates will appear here.'); render() }
        } else render()
      } else if (msg.type === 'created') {
        onArtifactCreated(msg)
      } else if (msg.type === 'updated') {
        const s = session(msg.sessionId)
        if (!s) return
        s.artifacts = s.artifacts.map(a => (a.id === msg.artifact.id ? msg.artifact : a))
        if (msg.artifact.id === activeArtifactId) selectArtifact(msg.artifact.id) // reload iframe
        else {
          if (msg.sessionId !== selectedSessionId) {
            unseen.set(msg.sessionId, (unseen.get(msg.sessionId) || 0) + 1)
          }
          render()
        }
      } else if (msg.type === 'removed') {
        const s = session(msg.sessionId)
        if (!s) return
        s.artifacts = s.artifacts.filter(a => a.id !== msg.artifact.id)
        if (msg.artifact.id === activeArtifactId) {
          const rest = artifactsOf(selectedSessionId)
          if (rest.length) selectArtifact(rest[rest.length - 1].id)
          else { showPlaceholder('Artifacts your agent creates will appear here.'); render() }
        } else render()
      }
    }
  }
  connect()

  // Send bridge: the sandboxed artifact iframe can't reach the server directly,
  // so claude.send() posts here and we forward it with the server token.
  window.addEventListener('message', async ev => {
    const d = ev.data
    if (!d || d.type !== 'sidecar:send' || ev.source !== viewer.contentWindow) return
    let ok = false
    try {
      const owner = sessionOfArtifact(d.artifactId)
      const res = await post('/api/webhook', {
        artifactId: d.artifactId,
        sessionId: owner ? owner.id : selectedSessionId,
        payload: d.payload,
      })
      ok = res.ok
    } catch {}
    ev.source.postMessage({ type: 'sidecar:sent', id: d.id, ok }, '*')
    if (ok) showToast('✓ Sent')
  })

  // Composer: free-text notes to the selected session, no artifact required
  async function sendNote() {
    const note = noteInput.value.trim()
    const s = session(selectedSessionId)
    if (!note || !s || !s.live) return
    noteSend.disabled = true
    try {
      const res = await post('/api/webhook', { kind: 'note', note, sessionId: s.id })
      if (res.ok) {
        noteInput.value = ''
        showToast(`✓ Note sent to ${s.label}`)
      }
    } catch {}
    noteSend.disabled = false
    noteInput.focus()
  }
  noteSend.addEventListener('click', sendNote)
  noteInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') sendNote() })
</script>
</body>
</html>
